name: mint
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: run mint
        run: |
          python3 -m pip install -q --upgrade selenium
          python3 cleanapis-mint.py 2>&1 | tee mint_run.log
          echo "### result" >> $GITHUB_STEP_SUMMARY
          cat output/mint_result.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no result json" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mint-output
          path: |
            output/
            mint_run.log
