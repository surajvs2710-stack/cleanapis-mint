name: ghsignup
on:
  workflow_dispatch:
  push:
    branches: [ghmint]
jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python3 -m pip install -q --upgrade selenium requests
          which google-chrome firefox geckodriver || true
      - name: run signup
        run: |
          mkdir -p output
          xvfb-run -a -s "-screen 0 1366x900x24" python3 ci/gh_signup_ci.py 2>&1 | tee output/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghsignup-output
          path: output/
